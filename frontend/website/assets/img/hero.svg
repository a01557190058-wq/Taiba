<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="رسم توضيحي تقني يمثل بيئة تعلم برمجية">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3C6B" />
      <stop offset="1" stop-color="#1769AA" />
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E97D6" />
      <stop offset="1" stop-color="#1769AA" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#EEF6FC" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#07284A" flood-opacity="0.22" />
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#1769AA" stroke-opacity="0.09" stroke-width="1" />
    </pattern>
  </defs>

  <rect x="20" y="20" width="600" height="520" rx="48" fill="url(#grid)" />
  <circle cx="330" cy="280" r="228" fill="#3E97D6" opacity="0.10" />
  <circle cx="500" cy="120" r="90" fill="#FFC928" opacity="0.10" />

  <!-- back panel -->
  <g transform="rotate(-7 320 280)">
    <rect x="118" y="112" width="440" height="300" rx="30" fill="url(#teal)" opacity="0.28" />
  </g>

  <!-- main code window -->
  <g filter="url(#shadow)">
    <rect x="96" y="74" width="452" height="344" rx="28" fill="url(#navy)" />
    <rect x="96" y="74" width="452" height="58" rx="28" fill="#07284A" />
    <rect x="96" y="106" width="452" height="26" fill="#07284A" />
    <circle cx="486" cy="103" r="6" fill="#E63946" />
    <circle cx="466" cy="103" r="6" fill="#FFC928" />
    <circle cx="446" cy="103" r="6" fill="#1769AA" />
    <rect x="126" y="96" width="92" height="14" rx="7" fill="#1769AA" opacity="0.75" />
  </g>

  <!-- code lines -->
  <g>
    <rect x="132" y="166" width="70" height="12" rx="6" fill="#BBD8EF" opacity="0.9" />
    <rect x="214" y="166" width="132" height="12" rx="6" fill="#DCEBF7" opacity="0.55" />
    <rect x="132" y="196" width="46" height="12" rx="6" fill="#FFC928" opacity="0.85" />
    <rect x="190" y="196" width="196" height="12" rx="6" fill="#DCEBF7" opacity="0.4" />
    <rect x="164" y="226" width="104" height="12" rx="6" fill="#9CC7E8" opacity="0.75" />
    <rect x="280" y="226" width="86" height="12" rx="6" fill="#DCEBF7" opacity="0.35" />
    <rect x="164" y="256" width="58" height="12" rx="6" fill="#DCEBF7" opacity="0.45" />
    <rect x="234" y="256" width="148" height="12" rx="6" fill="#BBD8EF" opacity="0.65" />
    <rect x="132" y="286" width="30" height="12" rx="6" fill="#FFC928" opacity="0.8" />
    <rect x="174" y="286" width="112" height="12" rx="6" fill="#DCEBF7" opacity="0.35" />
    <rect x="132" y="316" width="86" height="12" rx="6" fill="#DCEBF7" opacity="0.5" />
    <rect x="230" y="316" width="62" height="12" rx="6" fill="#9CC7E8" opacity="0.7" />
  </g>

  <!-- terminal footer inside window -->
  <rect x="126" y="352" width="238" height="40" rx="12" fill="#0B3C6B" />
  <circle cx="150" cy="372" r="7" fill="#1769AA" />
  <rect x="166" y="366" width="120" height="12" rx="6" fill="#BBD8EF" opacity="0.55" />

  <!-- floating card: smart lab -->
  <g filter="url(#shadow)">
    <rect x="24" y="140" width="196" height="92" rx="20" fill="url(#card)" />
  </g>
  <rect x="46" y="162" width="48" height="48" rx="14" fill="#EEF6FC" />
  <g transform="translate(70 186)" fill="none" stroke="#1769AA" stroke-width="3.4" stroke-linecap="round">
    <path d="M0 -13 L0 13 M-13 0 L13 0 M-9 -9 L9 9 M9 -9 L-9 9" opacity="0.55" />
    <circle cx="0" cy="0" r="4" fill="#1769AA" stroke="none" />
  </g>
  <rect x="110" y="164" width="86" height="11" rx="5.5" fill="#0B3C6B" opacity="0.85" />
  <rect x="110" y="186" width="62" height="10" rx="5" fill="#0B3C6B" opacity="0.35" />
  <rect x="110" y="206" width="40" height="9" rx="4.5" fill="#3E97D6" opacity="0.6" />

  <!-- floating card: project done -->
  <g filter="url(#shadow)">
    <rect x="420" y="356" width="196" height="96" rx="20" fill="url(#card)" />
  </g>
  <circle cx="460" cy="404" r="25" fill="#DCEBF7" />
  <path d="M449 404 L457 412 L472 396" fill="none" stroke="#1769AA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="496" y="382" width="94" height="11" rx="5.5" fill="#0B3C6B" opacity="0.8" />
  <rect x="496" y="404" width="66" height="10" rx="5" fill="#0B3C6B" opacity="0.32" />
  <rect x="496" y="424" width="44" height="9" rx="4.5" fill="#1769AA" opacity="0.5" />

  <!-- floating pill: labs -->
  <g filter="url(#shadow)">
    <rect x="40" y="416" width="168" height="56" rx="28" fill="url(#card)" />
  </g>
  <circle cx="72" cy="444" r="17" fill="#FFF9E8" />
  <path d="M66 436 H78 M70 436 V443 L63 452 A5 5 0 0 0 67 457 H77 A5 5 0 0 0 81 452 L74 443 V436" fill="none" stroke="#C79A00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="98" y="434" width="88" height="10" rx="5" fill="#0B3C6B" opacity="0.7" />
  <rect x="98" y="452" width="58" height="9" rx="4.5" fill="#0B3C6B" opacity="0.3" />

  <!-- decorative circuit -->
  <g fill="none" stroke="#1769AA" stroke-width="3" opacity="0.35" stroke-linecap="round">
    <path d="M540 60 H600 M600 60 V130" />
    <path d="M60 320 V370" />
  </g>
  <circle cx="600" cy="130" r="7" fill="#1769AA" opacity="0.4" />
  <circle cx="540" cy="60" r="5" fill="#3E97D6" opacity="0.5" />
</svg>
