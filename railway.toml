# Railway configuration.
# Add a Volume mounted at /var/data, then set the environment variables from
# docs/DEPLOY.md (DB_PATH=/var/data/taiba.sqlite, HOST=0.0.0.0, etc.).
[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm ci --omit=dev"

[deploy]
startCommand = "cd backend && npm run admin:init && npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
