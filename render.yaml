# Render Blueprint for the Taiba Technology School website.
# Create it from: Render Dashboard -> New -> Blueprint -> select this repository.
#
# This configuration targets the FREE plan, which has no persistent disk:
# the SQLite file lives inside the container and is recreated on every deploy
# or restart. SEED_DEMO_ON_EMPTY keeps the public pages populated after such a
# restart. For a production deployment that must keep applications, switch to
# `plan: starter` and add the disk block shown at the bottom of this file.
services:
  - type: web
    name: taiba-technology-school
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && npm run admin:init && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      # Ephemeral path: no disk is attached on the free plan.
      - key: DB_PATH
        value: ./data/taiba.sqlite
      # Refills the demo content when the database is recreated.
      - key: SEED_DEMO_ON_EMPTY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Set these in the Render dashboard. ADMIN_PASSWORD must be at least 10
      # characters; if left empty, a password is generated and printed once in
      # the deploy logs.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Set to the public URL after the first deploy, e.g.
      # https://taiba-technology-school.onrender.com
      - key: APP_ORIGIN
        sync: false

# --- Production upgrade (paid plan) -----------------------------------------
# Change `plan: free` to `plan: starter`, then add:
#
#    disk:
#      name: taiba-data
#      mountPath: /var/data
#      sizeGB: 1
#
# and set DB_PATH=/var/data/taiba.sqlite plus
# NEWS_UPLOADS_DIR=/var/data/uploads/news. Data then survives deploys.
